name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yourcve
          POSTGRES_PASSWORD: yourcve
          POSTGRES_DB: yourcve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yourcve" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://yourcve:yourcve@localhost:5432/yourcve_test?sslmode=disable
        run: go test -race -count=1 ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/${owner}/yourcve" >> "$GITHUB_OUTPUT"
          echo "pg=ghcr.io/${owner}/yourcve-postgres" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "ver=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; else echo "ver=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: yourcve image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.ver }}
          tags: |
            ${{ steps.meta.outputs.app }}:latest
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: PostgreSQL image (pgvector + WAL-G)
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.pg }}:17
            ${{ steps.meta.outputs.pg }}:17-${{ steps.meta.outputs.ver }}
